<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>whisper_my_name</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --line: #30363d;
        --text: #e6edf3;
        --dim: #8b949e;
        --a: #58a6ff;
        --b: #f78166;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        user-select: none;
      }
      header {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      input {
        background: #0b0f14;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 4px;
        padding: 4px 6px;
        font: inherit;
      }
      #url { flex: 1; }
      button {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 4px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--dim); }
      .lights { display: flex; gap: 10px; font-size: 11px; color: var(--dim); }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-right: 4px; }
      .dot.on { background: var(--ok); }
      #meta { padding: 6px 12px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
      #market { color: var(--text); }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
      .side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
      .side h2 { margin: 0 0 2px; font-size: 14px; }
      .side.a h2 { color: var(--a); }
      .side.b h2 { color: var(--b); }
      .quote { font-size: 18px; margin: 4px 0; }
      .quote .sz { color: var(--dim); font-size: 11px; }
      .pos { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
      .pos b { color: var(--text); }
      .row {
        display: grid;
        grid-template-columns: 26px 1fr 60px 52px 62px;
        gap: 6px;
        align-items: center;
        margin-bottom: 5px;
      }
      .key {
        text-align: center;
        color: var(--dim);
        border: 1px solid var(--line);
        border-radius: 3px;
        font-size: 11px;
        padding: 3px 0;
      }
      .buy { text-align: left; padding: 5px 8px; }
      .buy.veto { opacity: 0.4; border-color: var(--bad); }
      .buy .lbl { color: var(--dim); font-size: 10px; }
      .ready { font-size: 10px; text-align: center; color: var(--dim); }
      .ready.on { color: var(--ok); }
      .cap { color: var(--dim); font-size: 11px; text-align: right; }
      .sell { width: 100%; margin-top: 6px; padding: 6px; }
      #log {
        margin: 0 10px 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        height: 150px;
        overflow-y: auto;
        padding: 6px 8px;
        font-size: 11.5px;
      }
      #log div { white-space: pre-wrap; }
      .fill { color: var(--ok); }
      .warn { color: var(--warn); }
      .error { color: var(--bad); }
      .info { color: var(--dim); }
      .flash { animation: f 0.35s; }
      @keyframes f { from { background: #2d4a22; } to { background: transparent; } }
      #dry { color: var(--warn); font-weight: bold; }
      #dry.live { color: var(--bad); }
    </style>
  </head>
  <body>
    <header>
      <input id="url" placeholder="paste a Polymarket match URL…" />
      <select id="market-pick" style="display:none"></select>
      <button id="arm">Arm</button>
      <button id="dry" class="">DRY RUN</button>
    </header>

    <div id="meta">
      <span id="market">nothing armed</span>
      <span class="lights" style="float:right">
        <span><i id="l-book" class="dot"></i>book</span>
        <span><i id="l-fills" class="dot"></i>fills</span>
        <span><i id="l-warm" class="dot"></i><span id="warm-ms">conn</span></span>
      </span>
    </div>

    <main>
      <section class="side a" id="side-A">
        <h2>—</h2>
        <div class="quote"><span class="bid">–</span> / <span class="ask">–</span>
          <span class="sz"></span></div>
        <div class="pos">flat</div>
        <div class="rows"></div>
        <button class="sell">[7] SELL ALL</button>
      </section>
      <section class="side b" id="side-B">
        <h2>—</h2>
        <div class="quote"><span class="bid">–</span> / <span class="ask">–</span>
          <span class="sz"></span></div>
        <div class="pos">flat</div>
        <div class="rows"></div>
        <button class="sell">[8] SELL ALL</button>
      </section>
    </main>

    <div id="log"></div>
    <script src="renderer.js"></script>
  </body>
</html>
